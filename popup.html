<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLED Night</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header><h1>OLED Night <small id="version" class="version"></small></h1></header>
    <section class="site-panel">
      <div class="power-row">
        <div class="site-name"><h2 id="hostname">Current tab</h2><p id="status" class="status-line" aria-live="polite"></p></div>
        <label class="switch"><input id="siteEnabled" type="checkbox"><span></span><span class="sr-only">OLED Night on this site</span></label>
      </div>
      <button id="reloadTab" type="button" class="primary-button" hidden>Reload this tab</button>
      <div id="siteControls">
        <div id="siteTuning" class="tuning">
          <label><span>Text brightness <output id="brightnessValue"></output></span><input id="brightness" type="range" min="40" max="100"></label>
          <label><span>Surface contrast <output id="contrastValue"></output></span><input id="contrast" type="range" min="0" max="100"></label>
        </div>
        <p id="tuningHelp" class="control-help"></p>
        <button id="useRecolor" type="button" class="text-button" hidden>Use full recolor on this site</button>
        <label class="check"><input id="dimImages" type="checkbox"><span>Dim images on this site</span></label>
        <label class="mode-row"><span>Mode</span><select id="siteRule" aria-label="How OLED Night treats this site">
          <option value="auto">Automatic</option><option value="recolor">Full recolor</option><option value="deepen">Deepen blacks only</option><option value="invert">Invert (canvas apps)</option>
        </select></label>
        <button id="resetSite" type="button" class="text-button" hidden>Reset this site to defaults</button>
      </div>
    </section>
    <section class="global-panel">
      <div class="power-row"><div><h2>All sites</h2><p id="globalHelp">On for every site you haven't set yourself</p></div><label class="switch"><input id="globalEnabled" type="checkbox"><span></span><span class="sr-only">OLED Night on by default</span></label></div>
    </section>
    <footer class="actions">
      <button id="report" class="settings-link" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>Report a broken site</button>
      <button id="siteSettings" class="settings-link" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 15 .1.1 1.4 2.4-2.6 2.6-2.4-1.4-.1.1-1 .4V22H9.2v-2.8l-1-.4-.1-.1-2.4 1.4-2.6-2.6 1.4-2.4-.1-.1-.4-1H1.2v-4H4l.4-1 .1-.1-1.4-2.4 2.6-2.6 2.4 1.4.1-.1 1-.4V2h5.6v2.8l1 .4.1.1 2.4-1.4 2.6 2.6-1.4 2.4.1.1.4 1h2.8v4H20l-.6 1Z"/></svg>Settings &amp; defaults</button>
    </footer>
    <p class="hint"><span><kbd id="shortcut">Alt+Shift+D</kbd> turns this site on or off</span><a id="theme" href="https://chromewebstore.google.com/detail/oled-night-chrome-theme/pkdklfocgpcnijiggfddneadmhacbpmf" target="_blank" rel="noopener">Black Chrome theme</a></p>
  </main>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
