name: Diagnose row rendering
on: workflow_dispatch
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/lab/profile-rows.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: |
          node tools/package.mjs
          node tests/lab/run-performance.mjs --correctness
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Profile the full row-workload setup without changing its gates
        run: node tests/e2e/run.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          OLED_PROFILE_ROWS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: row-rendering-counterfactuals
          path: dist/performance/
