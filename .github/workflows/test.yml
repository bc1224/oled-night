name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      candidates:
        description: Capture screenshot candidates for explicit review (cannot deploy)
        type: boolean
        default: false
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cvs_stress: ${{ steps.cvs_stress.outcome }}
      cvs_live: ${{ steps.cvs_receipt.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: for t in tests/*.test.js tests/lab/*.test.js; do node "$t" || exit 1; done
      - name: End-to-end tests (real extension in headless Chrome)
        run: node tests/e2e/run.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Report UI, screenshot review and submission feedback
        run: node tests/e2e/report-ui.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Package
        run: node tools/package.mjs
      - name: Shortcut conflicts and immediate background updates in real Chrome
        run: |
          node tests/e2e/shortcut-conflicts.mjs
          node tests/lab/run-performance.mjs --correctness
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: browser-actions/setup-firefox@v1
      - run: npm run lint:firefox
      - run: npm run test:firefox
      - name: Product media, radio pixels and native keyboard, surface bands and QA identity
        run: |
          node tests/lab/run-oled-components.mjs
          node tests/lab/run-oled-firefox.mjs
          node tests/lab/run-navigation-work.mjs
          node tests/lab/run-chatgpt-streaming.mjs
          node tests/lab/qa-interface.mjs
          node tests/lab/run-compact-switches.mjs
          node tests/lab/run-compact-switches-firefox.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Component states, performance and reviewed visuals in Chrome
        run: node tests/lab/run-chrome.mjs ${{ inputs.candidates && '--candidates' || '' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Component states and performance in Firefox
        run: npm run test:lab:firefox
      - name: Known CVS synthetic regression (publish failures separately)
        id: cvs_stress
        continue-on-error: true
        run: node tests/lab/run-cvs.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Separate live CVS repeated hover result (published even when failing)
        id: cvs
        continue-on-error: true
        run: node tests/lab/live-smoke.mjs --cvs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Classify live CVS result without hiding an observed regression
        id: cvs_receipt
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {summarizeLive} from './tools/live-report.mjs'; console.log('status='+summarizeLive(JSON.parse(readFileSync('dist/lab-results/live-smoke.json'))).status)" >> "$GITHUB_OUTPUT"
      - name: Build browsable lab with passing evidence
        if: ${{ !inputs.candidates }}
        run: |
          npm run build:lab
          node tools/lab-report.mjs
          node tools/live-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oled-performance-diagnostics
          path: dist/performance/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oled-night-lab-evidence
          path: dist/lab-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oled-components-pixels
          path: |
            dist/oled-components/
            dist/compact-switches/
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        with:
          path: dist/site
      - uses: actions/upload-artifact@v4
        with:
          name: oled-night-zip
          path: dist/*.zip
  reported-controls:
    name: Reported control contrast in Chrome and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/package.mjs
      - uses: browser-actions/setup-firefox@v1
      - name: Switches, generated buttons, artwork and checkboxes in Chrome
        run: node tests/lab/run-reported-controls.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Switches, generated buttons, artwork and checkboxes in Firefox
        run: node tests/lab/run-reported-controls-firefox.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oled-reported-controls-evidence
          path: |
            dist/lab-results/reported-controls-*.json
            dist/reported-controls/*.png
  extension-regression-gate:
    name: CVS extension release gate
    needs: [test, reported-controls]
    runs-on: ubuntu-latest
    steps:
      - name: Require the known synthetic regression to pass for store submission
        env:
          CVS_OUTCOME: ${{ needs.test.outputs.cvs_stress }}
          CVS_LIVE: ${{ needs.test.outputs.cvs_live }}
        run: |
          if [ "$CVS_OUTCOME" != "success" ]; then
            echo "CVS regression is unresolved. Tester can publish evidence; extension store submission is blocked."
            exit 1
          fi
          if [ "$CVS_LIVE" = "fail" ]; then
            echo "Live CVS navigation caught a pale frame. Extension store submission is blocked."
            exit 1
          fi
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: [test, reported-controls]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified website and lab
        id: deployment
        uses: actions/deploy-pages@v4
