name: Submit browser stores
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, for example v0.6.20
        required: true
        type: string
      store:
        description: Store to submit on a manual run
        required: true
        default: both
        type: choice
        options: [both, amo, amo-listing, chrome, chrome-theme]
      diagnostic_public_key:
        description: Optional base64 PEM public key for an encrypted Chrome error report
        required: false
        type: string
      replace_pending_version:
        description: Explicit older Chrome version to replace if still pending review; blank preserves pending reviews
        required: false
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .store-uploader
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require passing tests for the exact tagged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .store-uploader/tools/verify-release-gate.mjs
      - name: Build exact tagged packages
        run: |
          node tools/package.mjs
          version=$(node -p "require('./manifest.json').version")
          git archive --format=zip --output="dist/oled-night-source-${version}.zip" HEAD
          cp .store-uploader/tools/submit-stores.mjs tools/submit-stores.mjs
      - name: Verify public site navigation before extension submission
        if: ${{ inputs.store != 'chrome-theme' && inputs.store != 'amo-listing' }}
        run: node .store-uploader/tests/lab/live-smoke.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          OLED_LAB_PACKAGE_ROOT: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-smoke-evidence
          path: .store-uploader/dist/lab-results/live-smoke.json
          if-no-files-found: ignore
      - name: Submit to Mozilla Add-ons
        if: ${{ github.event_name == 'release' || inputs.store == 'both' || inputs.store == 'amo' || inputs.store == 'amo-listing' }}
        id: amo
        continue-on-error: true
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_TARGET: ${{ inputs.store == 'amo-listing' && '--amo-listing' || '--amo' }}
        run: |
          if [[ -n "$AMO_API_KEY" && -n "$AMO_API_SECRET" ]]; then
            node tools/submit-stores.mjs "$AMO_TARGET"
          else
            echo 'AMO submission skipped: API credentials are not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Submit to Chrome Web Store
        if: ${{ github.event_name == 'release' || inputs.store == 'both' || inputs.store == 'chrome' || inputs.store == 'chrome-theme' }}
        id: chrome
        continue-on-error: true
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.diagnostic_public_key }}
          CWS_REPLACE_PENDING_VERSION: ${{ inputs.replace_pending_version }}
          CWS_TARGET: ${{ inputs.store == 'chrome-theme' && '--chrome-theme' || '--chrome' }}
        run: |
          if [[ -n "$CWS_CLIENT_ID" && -n "$CWS_CLIENT_SECRET" && -n "$CWS_REFRESH_TOKEN" && -n "$CWS_PUBLISHER_ID" ]]; then
            node tools/submit-stores.mjs "$CWS_TARGET"
          else
            echo 'Chrome Web Store submission skipped: OAuth credentials or publisher ID are not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save encrypted Chrome diagnostic
        if: ${{ always() && inputs.diagnostic_public_key != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cws-diagnostic
          path: dist/cws-error.encrypted.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Report submission failures
        if: ${{ steps.amo.outcome == 'failure' || steps.chrome.outcome == 'failure' }}
        run: exit 1
