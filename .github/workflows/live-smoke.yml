name: Live site smoke
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/package.mjs
      - run: node tests/lab/live-smoke.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-live-smoke
          path: dist/lab-results/live-smoke.json
