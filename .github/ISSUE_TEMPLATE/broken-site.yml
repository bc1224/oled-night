name: A site looks wrong
description: Text you can't read, white boxes, missing images, lag, or anything else broken with OLED Night on
labels: [site, oled-report]
body:
  - type: input
    id: site
    attributes:
      label: Site address
      description: Use only the public domain. Leave out private paths, query strings and account details.
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      placeholder: The product photos are black squares; the search box is white with white text...
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Issues are public. Remove private page text, account details and entered values before attaching an image.
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: Use "Report a broken site" in the popup to preview scrubbed diagnostics and open a GitHub draft. Do not attach full local reports, which may contain page text and identifiers.
  - type: input
    id: version
    attributes:
      label: OLED Night version
      description: Shown at the top of the popup, next to the name.
      placeholder: "0.6.2"
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Firefox, Edge, Brave, Arc, Opera, Vivaldi, Other]
