name: A site looks wrong
description: Text you can't read, white boxes, missing images, lag, or anything else broken with OLED Night on
labels: [site]
body:
  - type: input
    id: site
    attributes:
      label: Site address
      description: The page where it happens (leave out anything private).
      placeholder: https://example.com/some/page
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      placeholder: The product photos are black squares; the search box is white with white text...
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag a screenshot in here. One with OLED Night on and one with it off for the site is ideal.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: In the OLED Night popup on that page, click "Report a broken site". Drag the saved .json file here.
  - type: input
    id: version
    attributes:
      label: OLED Night version
      description: Shown at the top of the popup, next to the name.
      placeholder: "0.6.2"
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Brave, Arc, Opera, Vivaldi, Other]
