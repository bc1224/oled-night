<!doctype html><html><head><meta charset="utf-8"><title>Row hover</title><style>
/* Gmail-shaped dark inbox: about 50 elements per row and a :has() state rule,
   which leaves the extension unable to prove what a row hover repaints. */
body{margin:0;font:14px Arial,sans-serif;background:#111;color:#e3e3e3}
.list{height:100vh;overflow:auto}
table{border-collapse:collapse;width:100%;table-layout:fixed}
tr.zA{height:40px;border-bottom:1px solid #2a2a2a;background:#1f1f1f;cursor:pointer}
tr.zA:hover{box-shadow:inset 1px 0 0 #3c3c3c,0 1px 3px 0 rgba(0,0,0,.6);z-index:2}
.zA:hover:has(.att) > .meta{color:#fff}
.zA.hl{background:#f1f3f4}
.tools{display:none}tr.zA:hover .tools{display:inline-flex}
td{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{display:inline-block;width:18px;height:18px;border-radius:50%;background:#444;margin:0 2px}
.snip{color:#9aa0a6}.lbl{display:inline-block;padding:0 4px;border-radius:4px;background:#2d3e50;color:#cfe1f7;margin-left:4px}
</style></head><body><div class="list"><table><tbody id="rows"></tbody></table></div>
<script>
const icons=n=>Array.from({length:n},()=>'<span class="ic"><i></i></span>').join('');
document.getElementById('rows').innerHTML=Array.from({length:120},(_,i)=>`<tr class="zA" id="row${i}">
<td style="width:30px"><div role="checkbox" class="ic"></div></td><td style="width:60px">${icons(2)}</td>
<td style="width:180px"><span><span><b>Sender ${i}</b></span></span></td>
<td><div><span class="lbl">Label</span><span class="lbl">Work</span><span><b>Subject ${i}</b></span><span class="snip"> - snippet text that runs long for row ${i}</span>${i%3?'':'<span class="att">'+icons(3)+'</span>'}</div></td>
<td style="width:150px" class="meta"><span>Nov ${i%28+1}</span><span class="tools">${icons(6)}</span></td></tr>`).join('');
// Gmail-style hover paint from a site listener, switched on by the test after counting.
const rows=document.getElementById('rows');
rows.addEventListener('mouseover',e=>{if(!window.scriptedHover)return;const row=e.target.closest('tr.zA');if(row)row.classList.add('hl')});
rows.addEventListener('mouseout',e=>{const row=e.target.closest('tr.zA');if(row&&!row.contains(e.relatedTarget))row.classList.remove('hl')});
</script></body></html>
