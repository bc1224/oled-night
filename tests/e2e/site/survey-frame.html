<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Survey frame</title>
<style>
/* A same-origin survey card (Google Travel's price survey) is an iframe whose
   own element paints the white card, with a transparent document inside. */
body{margin:0;padding:16px;background:#fff;color:#202124;font:14px Arial,sans-serif}
.slots{display:flex;gap:16px}
iframe{border:0;width:300px;height:200px;border-radius:16px}
#cardFrame{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style></head>
<body>
<p>Hotels near the castle</p>
<div class="slots">
  <iframe id="cardFrame" title="Survey" src="survey-card.html"></iframe>
  <iframe id="clearFrame" title="Embedded note" src="survey-card.html"></iframe>
</div>
</body></html>
