<!doctype html><html><head><meta charset="utf-8"><style>
body { background: #f6f8f9; color: #182024; font: 16px sans-serif; }
.MenuListItem { background: white; padding: 12px; outline-offset: -2px; }
.MenuListItem-radio[aria-checked=true] { background-color: #e5ebee !important; }
.MenuListItem:focus-visible { outline: 2px solid #007faa; }
.state-option { background: transparent; padding: 12px; }
.state-option[aria-selected=true] { background: #e5ebee !important; }
.state-option[data-highlighted] { background: #dce7eb !important; }
.hover-option { background: white; padding: 12px; }
.hover-option:hover { background: #e5ebee !important; }
select, option { background: white; color: #182024; }
.app-menu li { background: transparent; padding: 10px; }
.app-menu li:hover, .app-menu li:focus-within { background: #f5f5f5; }
.app-menu li:active { background: #bde2f0; }
.app-menu a { color: #383838; }
.field-wrap:focus-within { background: #eee; }
#genericField { background: transparent; color: #222; -webkit-text-fill-color: #222; caret-color: #222; }
#genericField:focus { background: #f5f5f5; outline: 2px solid blue; }
#genericField::placeholder { color: #444; }
div.audit-page div.audit-table div.audit-active { background-color: #fbeb9c !important; }
.ma-attribute-group-expander .a-expander-header.a-link-section-expander { background-color:#f3f3f3!important; }
</style></head><body>
<ul role="menu" aria-label="Objective">
<li id="traffic" role="menuitemradio" aria-checked="false" class="MenuListItem-radio MenuListItem" tabindex="-1"><span>Traffic</span></li>
<li id="promotion" role="menuitemradio" aria-checked="true" class="MenuListItem-radio MenuListItem" tabindex="0"><span>App Promotion</span></li>
</ul>
<div role="listbox"><div id="dynamicOption" role="option" aria-selected="false" class="state-option">Dynamic selection</div></div>
<div id="hoverOption" class="hover-option" role="option" tabindex="0">Hover selection</div>
<select id="native"><option id="nativeOption">Native selection</option><option>Other</option></select>
<ul class="app-menu"><li id="transparentRow"><a id="transparentLink" href="#fixture"><span>Console fixture</span></a></li></ul>
<div class="field-wrap" id="fieldWrap"><input id="genericField" autocomplete="email" placeholder="Email fixture"></div>
<div id="shadowInteraction"></div>
<div class="audit-page"><div class="audit-table"><div id="importantRow" class="audit-active"><span>Selected flight fixture</span></div></div></div>
<script>
document.getElementById('shadowInteraction').attachShadow({mode:'open'}).innerHTML = '<style>button{background:transparent;color:#222}button:focus{background:#eee}</style><button>Shadow focus</button>';
// App CSS can arrive after the extension's document-start stylesheet.
setTimeout(() => {
  const style = document.createElement('style');
  style.textContent = '.MenuListItem-radio[aria-checked=true]{background-color:#e5ebee!important}.state-option[aria-selected=true]{background:#e5ebee!important}.hover-option:hover{background:#e5ebee!important}';
  document.head.append(style);
}, 500);
window.dropdownResult = id => {
  const el = document.getElementById(id), s = getComputedStyle(el);
  const lum = color => {
    const [r,g,b] = color.match(/[\d.]+/g).slice(0,3).map(v => { const n=+v/255; return n<=0.04045?n/12.92:((n+0.055)/1.055)**2.4; });
    return .2126*r+.7152*g+.0722*b;
  };
  const fg=lum(getComputedStyle(el.querySelector('span') || el).color), bg=lum(s.backgroundColor);
  return { background:s.backgroundColor, dark:bg<.05, contrast:(Math.max(fg,bg)+.05)/(Math.min(fg,bg)+.05), outline:s.outlineStyle, marked:el.getAttribute('data-oled-night') };
};
</script><div class="color-picker" id="colorPicker" style="background:linear-gradient(to right, red, lime, blue)"><span id="swatch" style="background:#fbeb9c;color:#222">Actual color</span></div><input id="nativeColor" type="color" value="#ff0000">
<div class="ma-attribute-group-expander"><a id="amazonHeader" role="button" aria-expanded="true" class="a-expander-header a-link-section-expander"><span>Delivery options fixture</span></a></div></body></html>
