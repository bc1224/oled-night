<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Email button</title></head>
<body style="margin:0;background:#fff;color:#1d1c1d;font:16px sans-serif">
<!-- Bulletproof email buttons pad the link with a thick border in the button's own color. -->
<table width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:24px">
  <a id="borderButton" href="#" style="display:block;background-color:#611f69;border-color:#611f69;border-style:solid;border-width:20px 24px;color:#ffffff;font-weight:900;letter-spacing:1px;text-align:center;text-decoration:none;text-transform:uppercase">Choose a new password</a>
  <p><a id="outlinedButton" href="#" style="display:inline-block;background:#fff;border:2px solid #611f69;color:#611f69;padding:8px 12px">Outlined action</a></p>
</td></tr></table>
<!-- Order emails force the label ink inline with !important on a transparent outlined button. -->
<table width="100%" cellspacing="0" cellpadding="0"><tr><td id="importantPanel" style="background-color:#f4f4f4;padding:20px">
  <table cellspacing="0" cellpadding="0"><tr><td bgcolor="transparent" style="border-radius:3px;background-color:transparent">
    <a id="importantButton" href="#" style="font-size:16px;font-family:Arial,Helvetica,sans-serif;text-align:left;text-decoration:none;display:block;background-color:transparent;border:1px solid #0c0c0c;padding:12px 35px;border-radius:3px;color:#000000 !important">Track the order</a>
  </td></tr></table>
  <p><a id="importantMixed" href="#" style="color:#000000 !important;text-decoration:none">Order <b id="importantMixedChild" style="color:#b00020">details</b></a></p>
</td></tr></table>
</body>
</html>
