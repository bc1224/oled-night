<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#202124;color:#f5f5f5;font:16px Arial,sans-serif}
  main{padding:32px;min-height:100vh}
  .plan{background:#fff;color:#fff;border:1px solid #fff;border-radius:999px;padding:12px 20px}
  .composer{position:fixed;bottom:24px;left:32px;display:flex;gap:12px;padding:12px;border-radius:28px;background:#202124;color:#f5f5f5}
  .stop{width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center}
  .stop svg{width:16px;height:16px;fill:#111}
  #stop-light{background:#fff;color:#111}
  #stop-dark{background:#292a2d;color:#f5f5f5}
</style></head><body><main>
  <button class="plan" id="plan">Check my plan costs</button>
  <div class="composer"><button class="stop" id="stop-light" aria-label="Stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button>
  <button class="stop" id="stop-dark" aria-label="Stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button></div>
</main></body></html>
