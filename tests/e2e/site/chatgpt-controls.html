<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#202124;color:#f5f5f5;font:16px Arial,sans-serif}
  main{padding:32px;min-height:100vh}
  .plan{background:#fff;color:#fff;border:1px solid #fff;border-radius:999px;padding:12px 20px}
  .composer{position:fixed;bottom:24px;left:32px;right:32px;display:flex;flex-wrap:wrap;gap:12px;padding:12px;border-radius:28px;background:#202124;color:#f5f5f5}
  .stop{width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center}
  .stop svg{width:16px;height:16px;fill:#111}
  #stop-light{background:#fff;color:#111}
  #stop-dark{background:#292a2d;color:#f5f5f5}
  #brand-logo{background:#fff}
  .voice{background:#fff;color:#000}
  .voice svg{width:32px;height:24px;fill:currentColor;color:#000}
  #voice-dark{background:#292a2d}
  #voice-readable{background:#292a2d}
  #voice-readable svg{color:#eee}
  #voice-yellow{background:#ffff00}
</style></head><body><main>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="voice" viewBox="0 0 32 24"><path d="M8 10v4m4-7v10m4-14v18m4-14v10m4-7v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol></svg>
  <button class="plan" id="plan">Check my plan costs</button>
  <div class="composer"><button class="stop" id="stop-light" aria-label="Stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button>
  <button class="stop" id="stop-dark" aria-label="Stop"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button>
  <button class="stop" id="brand-logo" aria-label="Brand logo"><svg viewBox="0 0 16 16"><path fill="#1463c7" d="M2 2h5v5H2z"/><path fill="#c42c54" d="M9 9h5v5H9z"/></svg></button>
  <button class="stop voice" id="voice-local" aria-label="Use voice"><svg viewBox="0 0 32 24"><use href="#voice"/></svg></button>
  <button class="stop voice" id="voice-external" aria-label="Use voice"><svg viewBox="0 0 32 24"><use href="chatgpt-sprite.svg#voice"/></svg></button>
  <button class="stop voice" id="voice-dark" aria-label="Use voice"><svg viewBox="0 0 32 24"><use href="chatgpt-sprite.svg#voice"/></svg></button>
  <button class="stop voice" id="voice-readable" aria-label="Use voice"><svg viewBox="0 0 32 24"><use href="chatgpt-sprite.svg#voice"/></svg></button>
  <button class="stop voice" id="voice-yellow" aria-label="Use voice"><svg viewBox="0 0 32 24"><use href="chatgpt-sprite.svg#voice"/></svg></button>
  <button class="stop voice" id="sprite-logo" aria-label="Brand logo"><svg viewBox="0 0 32 24"><use href="chatgpt-sprite.svg#brand"/></svg></button></div>
</main></body></html>
