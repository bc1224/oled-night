<!doctype html><meta charset="utf-8"><title>Compact switch visibility</title>
<style>
body{background:#131316;color:#eee;font:16px system-ui;margin:24px}
.panel{padding:24px;border:1px solid #555;border-radius:28px;max-width:360px}
button{cursor:pointer}
.compact{position:relative;display:inline-block;width:44px;height:26px;border:0;border-radius:999px;background:#dddde4;vertical-align:middle}
.compact::after{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:50%;background:#fff;transition:transform .1s}
.compact[aria-checked=true]{background:#176481}
.compact[aria-checked=true]::after{transform:translateX(18px)}
.compact:focus-visible{outline:2px solid #59bfff;outline-offset:3px}
.before-knob::after{content:none}
.before-knob::before{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:50%;background:#101418;transition:transform .1s}
.before-knob{background:#172a36}
.before-knob[aria-checked=true]::before{transform:translateX(18px)}
.decorative{margin-top:20px}
.colored::after{background:#e9328c}
</style>
<div class="panel"><p data-lab-check="text">Compact generated thumbs</p>
<button id="pseudo-switch" class="compact" type="button" role="switch" aria-label="Generated after setting" aria-checked="false" data-lab-check="switch"></button>
<button id="before-switch" class="compact before-knob" type="button" role="switch" aria-label="Generated before setting" aria-checked="false" data-lab-check="switch" data-lab-pseudo="before"></button>
<p data-lab-check="text">Negative examples: decoration and colored artwork</p>
<div id="decorative-pill" class="compact decorative" aria-hidden="true"></div>
<button id="colored-switch" class="compact colored" type="button" role="switch" aria-label="Colored thumb setting" aria-checked="false"></button>
</div>
<script>for(const b of document.querySelectorAll('button'))b.onclick=()=>b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'))</script>
