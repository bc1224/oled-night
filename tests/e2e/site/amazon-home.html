<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Amazon home cards</title>
<style>
/* Amazon-style home page: white cards and a lower deck over a pale grey page. Synthetic markup and text. */
body{margin:0;background:#e3e6e6;color:#0f1111;font:14px Arial,sans-serif}
#gw-layout{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px}
.a-cardui{background:#fff;padding:16px 20px;min-height:160px}
.a-cardui h2{margin:0 0 10px;font-size:21px;font-weight:700}
.a-cardui a{color:#007185}
#gwm-Deck-btf{background:#fff;margin:20px;padding:16px 20px}
</style></head>
<body>
<div id="gw-layout" class="gw-card-layout">
  <div class="a-cardui" id="homeCard"><h2>Shop deals in Fashion</h2><p>Jeans under $50</p><a href="#more">See all deals</a></div>
  <div class="a-cardui"><h2>Refresh your space</h2><p>Dining, home, kitchen</p><a href="#more">Shop the latest</a></div>
  <div class="a-cardui"><h2>Gaming merchandise</h2><p>Apparel, hats, toys</p><a href="#more">See more</a></div>
  <div class="a-cardui"><h2>New home arrivals</h2><p>Bedding, rugs, decor</p><a href="#more">Shop now</a></div>
</div>
<div id="gwm-Deck-btf"><h2>Inspired by your browsing history</h2><p>Lower deck with a carousel of fake products.</p></div>
</body></html>
