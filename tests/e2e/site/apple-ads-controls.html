<!doctype html><html><head><meta charset="utf-8"><title>Synthetic Apple Ads controls</title><style>
body{margin:32px;background:white;color:#222;font:16px Arial}section{padding:24px;background:#fafafa;width:600px;max-width:80vw}apui-wc-checkbox{display:inline-block;position:relative;margin:16px 32px 24px 0;width:160px;height:24px}.form-input__target{position:absolute;opacity:0;width:16px;height:16px;margin:0}.form-input__label{display:flex;align-items:center;gap:12px;cursor:pointer}.form-input__label__cover{display:inline-block;flex:none;width:16px;height:16px;border-radius:3px;background:white;box-shadow:inset 0 0 0 1px #ccc}.form-input__target:checked+label .form-input__label__cover{background:#007aff;box-shadow:none}.form-input__target:checked+label .form-input__label__cover:after{content:'✓';color:white;font-size:14px;line-height:16px;display:block;text-align:center}.form-input__target:focus-visible+label .form-input__label__cover{outline:2px solid #007aff;outline-offset:3px}.unrelated{display:block;width:16px;height:16px;background:white;box-shadow:inset 0 0 0 1px #ccc}apui-wc-popularity-dots{display:block;width:88px;height:24px;margin:20px 0}
</style></head><body><h1>Keyword controls</h1><section id="panel">
<apui-wc-checkbox><input class="form-input__target" type="checkbox" id="keyword"><label class="form-input__label" for="keyword"><span class="form-input__label__cover" id="cover"></span><span>Sample keyword</span></label></apui-wc-checkbox>
<apui-wc-checkbox><input class="form-input__target" type="checkbox" id="selected" checked><label class="form-input__label" for="selected"><span class="form-input__label__cover" id="selected-cover"></span><span>Selected keyword</span></label></apui-wc-checkbox>
<div id="shadow-check"></div><span id="unrelated" class="unrelated"></span>
<apui-wc-checkbox><input class="form-input__target" type="radio" id="radio"><label class="form-input__label" for="radio"><span class="form-input__label__cover" id="radio-cover"></span><span>Unrelated radio</span></label></apui-wc-checkbox>
<apui-wc-popularity-dots id="popularity" role="slider" aria-readonly="true" aria-valuemin="0" aria-valuemax="5" aria-valuenow="2" value="2"></apui-wc-popularity-dots>
</section><script>
const check=document.getElementById('shadow-check').attachShadow({mode:'open'});check.innerHTML='<style>apui-wc-checkbox{display:block;position:relative;width:160px;height:24px;margin:16px 0}input{position:absolute;opacity:0;width:16px;height:16px;margin:0}label{display:flex;align-items:center;gap:12px}.form-input__label__cover{width:16px;height:16px;border-radius:3px;background:white;box-shadow:inset 0 0 0 1px #ccc}</style><apui-wc-checkbox><input type="checkbox" id="shadow-keyword"><label for="shadow-keyword"><span id="shadow-cover" class="form-input__label__cover"></span>Shadow keyword</label></apui-wc-checkbox>';
const dots=document.getElementById('popularity').attachShadow({mode:'open'});dots.innerHTML='<style>.popularity-dots{display:inline-flex;gap:4px;height:8px}.popularity-dots__dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:white;box-shadow:inset 0 0 0 1px #ddd}.popularity-dots__dot--on{background:#007aff;box-shadow:none}</style><span class="popularity-dots">'+Array.from({length:5},(_,i)=>'<span class="popularity-dots__dot'+(i<2?' popularity-dots__dot--on':'')+'"></span>').join('')+'</span>';
</script></body></html>
