<!doctype html><html><head><meta charset="utf-8"><title>Synthetic calendar booking surfaces</title><style>
body{margin:24px;background:#fff;color:#202124;font:16px Arial}.description{position:relative;height:68px;overflow:hidden}.description:after{content:' ';position:absolute;bottom:0;left:0;right:0;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0),rgb(255,255,255))}
.days{display:flex;gap:16px}.day{flex:1}.slot{background:white}.slot button{width:100%;margin:4px 0;padding:12px;border:1px solid #dadce0;border-radius:24px;background:transparent;color:#1967d2}.slot button:hover,.slot button:focus-visible{background:#e8f0fe;outline:2px solid #1967d2}.card{width:280px;padding:20px;border-radius:12px;background:#fff;box-shadow:0 1px 4px #0004}.art{height:40px;background:linear-gradient(90deg,#f00,#00f)}
</style></head><body><header><h1>Book a synthetic appointment</h1><div class="description" id="booking-description">A short introduction.<p>Looking forward to connecting!</p><p>Additional synthetic description.</p></div></header><main><h2>Select an appointment time</h2><div class="days"><div class="day" role="list" aria-label="Monday"><div class="slot" role="listitem" id="booking-slot"><button id="booking-time" type="button">1:00pm</button></div><div class="slot" role="listitem"><button type="button">1:20pm</button></div></div><div class="day" role="list" aria-label="Tuesday"><div class="slot" role="listitem"><button type="button">10:00am</button></div></div></div><div class="card" id="booking-card">A separate raised white card</div><div class="art" id="booking-art"></div></main></body></html>
