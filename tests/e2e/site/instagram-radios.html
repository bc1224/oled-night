<!doctype html><html><meta charset="utf-8"><title>Instagram-style sibling radio markers</title><style>
html { color-scheme: dark; background: #0a0a0a; color: #fafafa; font: 16px Arial }
html.light { color-scheme: light; background: #fff; color: #111 }
body { margin: 30px }
.choice { display: flex; align-items: center; gap: 12px; margin: 24px 0 }
.control { position: relative; display: flex; width: 24px; height: 24px }
.ring { box-sizing: border-box; width: 24px; height: 24px; border: 1px solid currentColor; border-radius: 50% }
.center { display: flex; align-items: center; justify-content: center; width: 100%; height: 100% }
.dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fafafa }
.light .dot { background: #111 }
.control input { opacity: .001; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0 }
.control:focus-within { outline: 2px solid #448aff; outline-offset: 4px }
#decorative { display: block; width: 14px; height: 14px; border-radius: 50%; background: #111 }
#colored { background: #168cdd }
.product-swatch { display: inline-block; position: relative; width: 24px; height: 24px }
#product-dot { display: block; width: 14px; height: 14px; border-radius: 50%; background: #111 }
</style><h1>Feedback emails</h1>
<label class="choice"><span class="control"><span class="ring"><span class="center"><span id="off-dot" class="dot"></span></span></span><input id="off" type="radio" name="emails" value="off" aria-checked="true" checked></span>Off</label>
<label class="choice"><span class="control"><span class="ring"><span class="center"><span id="on-dot"></span></span></span><input id="on" type="radio" name="emails" value="on" aria-checked="false"></span>On</label>
<span id="decorative"></span>
<span class="control"><span class="ring"><span class="center"><span id="colored" class="dot"></span></span></span><input type="radio" checked aria-label="Colored marker"></span>
<span class="product-swatch"><span id="product-dot"></span><input type="radio" checked aria-label="Product swatch"></span>
<script>
if (new URLSearchParams(location.search).has('light')) document.documentElement.classList.add('light');
document.addEventListener('change', () => { for (const id of ['off', 'on']) { const input = document.getElementById(id); input.setAttribute('aria-checked', String(input.checked)); document.getElementById(id + '-dot').className = input.checked ? 'dot' : ''; } });
</script></html>
