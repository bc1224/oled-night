<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shadow card</title>
<style>
body{margin:0;background:#fff;color:#333;font:16px sans-serif;padding:40px}
.card{width:420px;margin:0 auto 32px;background:#fff;border-radius:6px;padding:24px;text-align:center}
.lift{box-shadow:0 2px 10px rgba(0,0,0,.15)}
.cta{display:block;padding:14px;border:1px solid #c6f0d0;border-radius:6px;background:#f0fdf4;color:#1a7f1a;box-shadow:0 1px 2px rgba(0,0,0,.2)}
</style></head>
<body>
<!-- A white card on a white page is separated only by its dark drop shadow (rewards interstitials). -->
<div class="card lift" id="shadowCard"><h2>Ad blocker detected</h2><p>Leaving it on may impact rewards confirmation.</p>
  <a class="cta" id="shadowCta" href="#">Help me turn it off</a></div>
<div class="card" id="flatCard"><p>A flat card with no shadow stays flat.</p></div>
</body>
</html>
