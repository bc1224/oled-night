<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#202124;color:#202124;font:14px Arial}.row{height:24px}.row:hover{background:#303134}.row span,b{color:#e8eaed}#editor{min-height:60px;background:#202124;color:#ddd}
</style></head><body><div id="editor" contenteditable="true" role="textbox">Draft:</div><div id="history"></div><script>
// Match webmail's structural paint and stylesheet scale using synthetic content.
document.getElementById('history').innerHTML=Array.from({length:1000},(_,i)=>`<div class="row"><span>Message ${i}</span><b>Subject</b><span>Preview</span></div>`).join('');
const style=document.createElement('style');
style.textContent=Array.from({length:28248},(_,i)=>`.unused-${i} .nested[data-state="ready"]:hover{color:#ddd;background:transparent}`).join('\n');
document.head.append(style);
globalThis.samples={pointer:[],typing:[]};
for(const [type,key] of [['pointerover','pointer'],['beforeinput','typing']])document.addEventListener(type,event=>{const start=event.timeStamp;requestAnimationFrame(()=>samples[key].push(performance.now()-start))},true);
</script></body></html>
