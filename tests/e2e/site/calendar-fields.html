<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Calendar fields</title>
<style>
/* Google Calendar event editor: barely blue fields (#f0f4f9) beside a clearly tinted chip (#d3e3fd). Synthetic markup. */
body{margin:0;padding:20px;background:#fff;color:#1f1f1f;font:14px Arial,sans-serif}
.field{background:#f0f4f9;border:0;border-radius:4px;padding:10px 12px;margin:8px 0;width:420px;display:block;color:#1f1f1f;font:inherit}
.chip{display:inline-block;background:#d3e3fd;color:#041e49;border-radius:8px;padding:6px 12px}
</style></head>
<body>
<h1>Edit event</h1>
<input class="field" id="locationField" value="Conference room 4">
<input class="field" id="guestsField" value="Add guests">
<textarea class="field" id="descriptionField" rows="3">Agenda and notes</textarea>
<span class="chip" id="tintedChip">Busy</span>
</body></html>
